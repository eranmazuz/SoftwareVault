# Woodpecker CI Pipeline Configuration
# Documentation: https://woodpecker-ci.org/

networks:
  shared-net:
    name: tools-net
    external: true

steps:
  # 1. Backend Lint / Syntax Check
  backend-test:
    image: python:3.11-slim
    commands:
      - pip install -r backend/requirements.txt
      - python -m py_compile backend/app/main.py backend/app/models.py backend/app/schemas.py backend/app/crud.py backend/app/ai.py
    when:
      event: push
      branch: main

  # 2. Frontend Lint & Build Compilation Check
  frontend-build:
    image: node:20-alpine
    commands:
      - cd frontend
      - npm install
      - npm run build
    when:
      event: push
      branch: main

  # 3. Build & Publish Combined Image (Template Base)
  build-and-push:
    image: plugins/docker
    privileged: true
    networks:
      - shared-net
    settings:
      # Loaded dynamically from Woodpecker Secrets
      registry:
        from_secret: docker_registry
      repo:
        from_secret: docker_image
      insecure: true
      # Docker build parameters
      dockerfile: Dockerfile
      context: .
      tags:
        - latest
        - ${CI_COMMIT_SHA:0:8}
      # Secrets to store credentials securely in Woodpecker CI
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
    when:
      event: push
      branch: main

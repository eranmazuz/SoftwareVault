steps:
  # 1. Backend Lint / Syntax Check
  backend-test:
    image: python:3.11-slim
    commands:
      - pip install -r backend/requirements.txt
      - python -m py_compile backend/app/main.py backend/app/models.py backend/app/schemas.py backend/app/crud.py backend/app/ai.py

  # 2. Frontend Lint & Build Compilation Check
  frontend-build:
    image: node:20-alpine
    commands:
      - cd frontend
      - npm install
      - npm run build

  # 3. Build & Publish Combined Image
  publish-app:
    image: plugins/kaniko
    settings:
      registry:
        from_secret: docker_registry
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      repo:
        from_secret: docker_image
      context: .
      dockerfile: Dockerfile
      tags:
        - latest
        - main
